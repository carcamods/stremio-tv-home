# Rebuilds your Stremio lists addon from Trakt every 3 hours and serves it from your own Cloudflare
# account, at your private link. Goes in YOUR PRIVATE builder repo as .github/workflows/publish-lists.yml,
# next to your lists.json. Setup: https://github.com/carcamods/stremio-tv-home/blob/v1.0.0/lists/README.md
#
# Set by connect.py: the secrets TRAKT_CLIENT_ID, TRAKT_TOKEN_JSON, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID and ADDON_KEY, and the variable ADDON_URL. Set by you: the variable LISTS_ENABLED=true,
# and the release's commit below (step 3 of the setup guide). Keep this repo private.
name: Publish lists

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Renew the Trakt sign-in now (normally done 2 days before it expires)"
        type: boolean
        default: false

env:
  # The builder code runs with your Trakt sign-in and your Cloudflare token, so it comes from a fixed
  # release of the public repo, at the commit that release had when you set it up: a tag moved later, or a
  # repo replaced under the same name, can't change what runs. To update, follow "Updating" in the guide.
  STREMIO_TV_HOME_VERSION: v1.0.0
  STREMIO_TV_HOME_COMMIT: filled-in-by-the-setup-guide

concurrency:
  group: publish-lists
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: vars.LISTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The Actions cache holds your Trakt sign-in. In a public repo or a fork, other people's workflows
      # could read it, and a run on another branch would use up its single-use refresh token.
      - name: Check this is your private repo, on its default branch, with a pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$STREMIO_TV_HOME_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Set STREMIO_TV_HOME_COMMIT to the commit of $STREMIO_TV_HOME_VERSION (step 3 of the setup guide)."
            exit 1
          fi
          read -r private fork branch < <(gh api "repos/$GITHUB_REPOSITORY" --jq '[.private, .fork, .default_branch] | @tsv')
          if [ "$private" != true ] || [ "$fork" != false ] || [ "$GITHUB_REF_NAME" != "$branch" ]; then
            echo "::error::This runs only in a private repo that isn't a fork, on its default branch."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the builder code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: carcamods/stremio-tv-home
          ref: ${{ env.STREMIO_TV_HOME_COMMIT }}
          path: upstream
          persist-credentials: false

      # Trakt's refresh tokens work once, so each run keeps the newest sign-in in the Actions cache, with
      # the lists it published (a list Trakt can't return next time keeps its last titles).
      - name: Restore the Trakt sign-in and the last lists
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: trakt-login-latest-never-exact
          restore-keys: trakt-login-

      - name: Build the lists
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_TOKEN_JSON: ${{ secrets.TRAKT_TOKEN_JSON }}
        run: python3 upstream/lists/build.py --config lists.json --state .state ${{ inputs.force_refresh && '--force-refresh' || '' }}

      - name: Save the Trakt sign-in and the lists
        if: always() && hashFiles('.state/trakt-token.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: trakt-login-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish to your private link
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADDON_KEY: ${{ secrets.ADDON_KEY }}
          ADDON_URL: ${{ vars.ADDON_URL }}
        run: python3 upstream/lists/cloudflare.py --site .state/site
