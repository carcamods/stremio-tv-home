# Install once per clone:  uvx pre-commit install
# Run on everything:       uvx pre-commit run --all-files
# Each rev is the commit of the tag in its comment ("frozen"), so a moved tag can't change what runs.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Staged changes only, at commit time, with .gitleaks.toml; CI scans the full history.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # --enforce-all: every file, not only the ones a commit adds, so the limits also hold in CI.
      - id: check-added-large-files
        args: ["--maxkb=1024", "--enforce-all"]
        exclude: ^docs/media/ # README pictures and demos, limits in docs/standards.md
      - id: check-added-large-files
        name: check README pictures and demos are under 8 MB
        args: ["--maxkb=8192", "--enforce-all"]
        files: ^docs/media/
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
